name: Build and Deploy to VPS

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:

  checkout:
    runs-on: ubuntu-latest
    outputs:
      api_version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get Bot Version from Tag
        id: get_version
        run: |
          # Extract the GitHub tag version
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Version extracted: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Archive project files
        uses: actions/upload-artifact@v4
        with:
          name: project-files
          path: .

  notify_start:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - name: Notify Deployment Start
        run: |
          start_msg="🚀 Deployment Start for: <code>${{ github.repository }}</code> on branch <code>${{ github.ref_name }}</code>%0A☑️Version: <code>${{ needs.checkout.outputs.api_version }}</code>%0A☑️Commit: ${{ github.event.head_commit.message }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${start_msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}&parse_mode=HTML"

  copy:
    needs: notify_start
    runs-on: ubuntu-latest
    steps:
      - name: Download project files
        uses: actions/download-artifact@v4
        with:
          pattern: project-files
          merge-multiple: true

      - name: Clean remote target directory
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf ~/Catebi.Api/*

      - name: Copy project files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: .
          target: ~/Catebi.Api

  build_deploy:
    needs: [copy, checkout]
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.sha }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
    - name: Build and deploy
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/Catebi.Api
          echo "VERSION=${{ needs.checkout.outputs.api_version }}" > .env
          echo "BUILD=${{ env.COMMIT_SHA }}" >> .env
          echo "CATEBI_APP_DB_PASS=${{ secrets.CATEBI_APP_DB_PASS }}" >> .env
          echo "POSTGRES_DB_PASS=${{ secrets.POSTGRES_DB_PASS }}" >> .env
          echo "ADOPTIONBOT_TELEGRAM_TOKEN=${{ secrets.ADOPTIONBOT_TELEGRAM_TOKEN }}" >> .env
          echo "ADOPTIONBOT_COMMON_BOT_TOKEN=${{ secrets.ADOPTIONBOT_COMMON_BOT_TOKEN }}" >> .env
          echo "ADOPTIONBOT_AIRTABLE_APIKEY=${{ secrets.ADOPTIONBOT_AIRTABLE_APIKEY }}" >> .env
          echo "ADOPTIONBOT_AIRTABLE_BASEID=${{ secrets.ADOPTIONBOT_AIRTABLE_BASEID }}" >> .env
          echo "VOLUNTEER_BOT_TOKEN=${{ secrets.VOLUNTEER_BOT_TOKEN }}" >> .env
          echo "FINANCE_TRIBUTE_APIKEY=${{ secrets.FINANCE_TRIBUTE_APIKEY }}" >> .env
          echo "CATEBI_TELEGRAM_SUPERCHAT_ID=${{ secrets.CATEBI_TELEGRAM_SUPERCHAT_ID }}" >> .env
          echo "CATEBI_FINANCE_TELEGRAM_TOPIC_ID=${{ secrets.CATEBI_FINANCE_TELEGRAM_TOPIC_ID }}" >> .env
          echo "FINANCE_AIRTABLE_APIKEY=${{ secrets.FINANCE_AIRTABLE_APIKEY }}" >> .env
          echo "FINANCE_AIRTABLE_BASEID=${{ secrets.FINANCE_AIRTABLE_BASEID }}" >> .env
          echo "CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}" >> .env
          docker-compose down
          docker-compose up --build -d
          sleep 10  # Wait for 10 seconds before performing health check

  healthcheck:
    needs: build_deploy
    runs-on: ubuntu-latest
    outputs:
      overall_status: ${{ steps.healthcheck.outputs.overall_status }}
    steps:
    - name: Verify Deployment Healthcheck
      id: healthcheck
      run: |
        json=$(curl -s https://api.catebi.ge/hc)
        overall_status=$(echo "$json" | jq -r '.status')
        echo "overall_status=$overall_status" >> $GITHUB_OUTPUT
        echo "Overall Status: $overall_status"
        if [[ "$overall_status" == "Healthy" ]]; then
          echo "Healthcheck passed"
        else
          echo "Healthcheck failed: Overall Status: $overall_status"
          health_msg="❌ Healthcheck failed for ${{ github.repository }}. Status: $overall_status"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${health_msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}"
        fi

  notify_finish:
    runs-on: ubuntu-latest
    needs: [checkout, notify_start, copy, build_deploy, healthcheck]
    if: ${{ always() }}

    steps:
    - name: Notify Deployment and Healthcheck Result
      if: ${{needs.checkout.result == 'success' && needs.build_deploy.result == 'success' && needs.healthcheck.result == 'success' && needs.copy.result == 'success' && needs.healthcheck.outputs.overall_status == 'Healthy' }}
      run: |
        echo "Overall Status: ${{ needs.healthcheck.outputs.overall_status }}"
        if [[ "${{ needs.healthcheck.outputs.overall_status }}" == "Healthy" ]]; then
          echo "Deployment and healthcheck passed"
          msg="✅ Successful Deployment and Healthcheck Passed:%0A🤖<code>${{ github.repository }}</code> at <code>${{ github.sha }}</code>%0A☑️Version: <code>${{ needs.checkout.outputs.api_version }}</code>"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}&parse_mode=HTML"
        fi
    - name: Notify Deployment Failure
      if: ${{ needs.checkout.result != 'success' || needs.build_deploy.result != 'success' || needs.healthcheck.result != 'success' || needs.copy.result != 'success' || needs.healthcheck.outputs.overall_status != 'Healthy' }}
      run: |
        failure_msg="❌ Deployment Failed: Check the actions log for details.%0AView Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0A☑️Version: <code>${{ needs.checkout.outputs.api_version }}</code>"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${failure_msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}"
