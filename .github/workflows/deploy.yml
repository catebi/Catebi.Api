name: Build and Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Extract commit message
      run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%B | jq -sRr @uri)
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV

    - name: Notify Deployment Start
      run: |
        start_msg="🚀 Deployment Start for: ${{ github.repository }} on branch ${{ github.ref_name }}\nCommit ☑️: ${{ env.COMMIT_MESSAGE }}"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${start_msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}"

    - name: Set Version Info
      run: |
        echo "COMMIT_SHA=$GITHUB_SHA" >> $GITHUB_ENV
        echo "GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER" >> $GITHUB_ENV
        echo "BRANCH_NAME=$GITHUB_REF_NAME" >> $GITHUB_ENV

    - name: Setup SSH and SCP files
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          mkdir -p ~/Catebi.Api
          rm -rf ~/Catebi.Api/*

    - name: Copy source and Docker configs
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: "."
        target: "~/Catebi.Api"

    - name: Build and deploy using Docker on VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd ~/Catebi.Api
          echo "VERSION=0.0.0-${{env.BRANCH_NAME}}-${{ env.GITHUB_RUN_NUMBER }}" > .env
          echo "BUILD=${{ env.COMMIT_SHA }}" >> .env
          echo "CATEBI_APP_DB_PASS=${{ secrets.CATEBI_APP_DB_PASS }}" >> .env
          echo "POSTGRES_DB_PASS=${{ secrets.POSTGRES_DB_PASS }}" >> .env
          echo "ADOPTIONBOT_TELEGRAM_TOKEN=${{ secrets.ADOPTIONBOT_TELEGRAM_TOKEN }}" >> .env
          echo "ADOPTIONBOT_AIRTABLE_APIKEY=${{ secrets.ADOPTIONBOT_AIRTABLE_APIKEY }}" >> .env
          echo "ADOPTIONBOT_AIRTABLE_BASEID=${{ secrets.ADOPTIONBOT_AIRTABLE_BASEID }}" >> .env
          docker-compose down
          docker-compose up --build -d

    - name: Verify Deployment Healthcheck
      run: |
        json=$(curl -s https://api.catebi.ge/api/hc)
        overall_status=$(echo "$json" | jq -r '.status')
        if [[ "$overall_status" == "Healthy" ]]; then
          echo "Healthcheck passed"
        else
          echo "Healthcheck failed: Overall Status: $overall_status"
          health_msg="❌ Healthcheck failed for ${{ github.repository }}. Status: $overall_status"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${health_msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}"

    - name: Notify Deployment and Healthcheck Result
      if: success()
      run: |
            if [[ "$overall_status" == "Healthy" ]]; then
              echo "Deployment and healthcheck passed"
              msg="✅ Successful Deployment and Healthcheck Passed: ${{ github.repository }} at ${{ github.sha }}"
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}"

    - name: Notify Deployment Failure
      if: failure()
      run: |
        failure_msg="❌ Deployment Failed: Check the actions log for details. View Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${failure_msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}"
